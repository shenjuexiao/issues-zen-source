# .github/workflows/issues-zen-dist.yml
name: issues-astro-dist

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '指定 Issue 编号，留空默认所有'
        required: false
        default: ''

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      id-token: write
      pages: write

    steps:
      # 检出源代码仓库（issues-zen-source）
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: shenjuexiao/issues-zen-source
          token: ${{ secrets.ISSUES_ZEN }}
          path: source-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Astro and dependencies
        run: |
          cd source-repo
          npm install

      # 清理孤立和重复的文章文件
      - name: Clean up orphaned and duplicate post files BEFORE generation
        run: |
          cd source-repo

          # 配置 git 用户信息
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 先拉取远程最新变更
          git pull --rebase https://x-access-token:${{ secrets.ISSUES_ZEN }}@github.com/shenjuexiao/issues-zen-source.git main || true

          # 获取所有现有的 Issue 信息（包括编号和标题）
          PAGE=1
          ISSUE_DATA=""
          while true; do
            PAGE_ISSUES=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_ZEN }}" \
              "https://api.github.com/repos/shenjuexiao/issues-zen-source/issues?state=all&per_page=100&page=$PAGE")

            COUNT=$(echo "$PAGE_ISSUES" | jq '. | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            if [ -z "$ISSUE_DATA" ]; then
              ISSUE_DATA="$PAGE_ISSUES"
            else
              ISSUE_DATA=$(echo "$ISSUE_DATA $PAGE_ISSUES" | jq -s 'add')
            fi
            PAGE=$((PAGE + 1))
          done

          # 如果指定了 issue_number，只处理该 issue
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            ISSUE=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_ZEN }}" \
              "https://api.github.com/repos/shenjuexiao/issues-zen-source/issues/$ISSUE_NUMBER")
            ISSUE_DATA="[$ISSUE]"
          fi

          # 为每个 Issue 生成预期的文件名
          echo "$ISSUE_DATA" | jq -c '.[]' | while read -r issue; do
            NUMBER=$(echo "$issue" | jq -r '.number')
            TITLE=$(echo "$issue" | jq -r '.title')
            CREATED_AT=$(echo "$issue" | jq -r '.created_at')

            SAFE_TITLE=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
            DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)
            EXPECTED_FILENAME="${DATE}-${SAFE_TITLE}.md"

            # 存储期望的文件名
            echo "$NUMBER:$EXPECTED_FILENAME" >> /tmp/expected_files.txt
          done

          # 检查 src/content/blog 目录中的每个文件
          if [ -d "src/content/blog" ]; then
            for file in src/content/blog/*.md; do
              if [ -f "$file" ]; then
                FILENAME=$(basename "$file")

                # 提取 issue_number（front matter 格式）
                ISSUE_NUM=$(grep "^issue_number:" "$file" | awk '{print $2}' | tr -d '"')

                if [ -n "$ISSUE_NUM" ]; then
                  # 检查这个 Issue 是否还存在
                  ISSUE_EXISTS=$(echo "$ISSUE_DATA" | jq -r ".[] | select(.number == $ISSUE_NUM) | .number")

                  if [ -z "$ISSUE_EXISTS" ]; then
                    # Issue 已被删除
                    echo "Removing orphaned post: $file (issue #$ISSUE_NUM not found)"
                    git rm -f "$file"
                  else
                    # 检查文件名是否匹配期望的文件名
                    EXPECTED=$(grep "^$ISSUE_NUM:" /tmp/expected_files.txt | cut -d':' -f2)
                    if [ -n "$EXPECTED" ] && [ "$FILENAME" != "$EXPECTED" ]; then
                      # 文件名不匹配（标题已更改），删除旧文件
                      echo "Removing old file: $file (expected: $EXPECTED, issue #$ISSUE_NUM title changed)"
                      git rm -f "$file"
                    fi
                  fi
                else
                  # 文件中没有 issue_number，可能是手动创建的，保留
                  echo "Skipping file without issue_number: $file"
                fi
              fi
            done
          fi

          # 提交删除操作
          if git diff --staged --quiet; then
            echo "No orphaned or duplicate files to remove"
          else
            git commit -m "Remove orphaned and duplicate post files [skip ci]"
            git push https://x-access-token:${{ secrets.ISSUES_ZEN }}@github.com/shenjuexiao/issues-zen-source.git main
          fi

      # 从 Issues 获取并转换为 Markdown (Astro 格式)
      - name: Fetch and convert issues to markdown (Astro format)
        run: |
          cd source-repo
          mkdir -p src/content/blog

          # 获取所有 issues（包括关闭的）- 分页处理
          PAGE=1
          ALL_ISSUES=""
          while true; do
            PAGE_ISSUES=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_ZEN }}" \
              "https://api.github.com/repos/shenjuexiao/issues-zen-source/issues?state=all&per_page=100&page=$PAGE")

            COUNT=$(echo "$PAGE_ISSUES" | jq '. | length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            if [ -z "$ALL_ISSUES" ]; then
              ALL_ISSUES="$PAGE_ISSUES"
            else
              ALL_ISSUES=$(echo "$ALL_ISSUES $PAGE_ISSUES" | jq -s 'add')
            fi
            PAGE=$((PAGE + 1))
          done

          # 如果指定 issue_number，只处理此 issue
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
            ISSUE=$(curl -s -H "Authorization: token ${{ secrets.ISSUES_ZEN }}" \
              "https://api.github.com/repos/shenjuexiao/issues-zen-source/issues/$ISSUE_NUMBER")
            ALL_ISSUES="[$ISSUE]"
          fi

          # 处理每个 issue
          echo "$ALL_ISSUES" | jq -c '.[]' | while read -r issue; do
            # 提取信息
            TITLE=$(echo "$issue" | jq -r '.title')
            NUMBER=$(echo "$issue" | jq -r '.number')
            STATE=$(echo "$issue" | jq -r '.state')
            CREATED_AT=$(echo "$issue" | jq -r '.created_at')
            BODY=$(echo "$issue" | jq -r '.body // ""')
            LABELS_JSON=$(echo "$issue" | jq -c '[.labels[].name]')

            # 清理标题作为文件名
            SAFE_TITLE=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')

            # 格式化日期 YYYY-MM-DD
            DATE=$(date -d "$CREATED_AT" +%Y-%m-%d)

            # 生成文件名
            FILENAME="${DATE}-${SAFE_TITLE}.md"
            FILEPATH="src/content/blog/$FILENAME"

            # 转义标题中的特殊字符
            ESCAPED_TITLE=$(echo "$TITLE" | sed 's/"/\\"/g')

            # 判断是否草稿（closed 状态）
            DRAFT="false"
            if [ "$STATE" = "closed" ]; then
              DRAFT="true"
            fi

            # 提取 description（正文前60字）
            # 先移除 Markdown 标记，然后提取纯文本
            PLAIN_TEXT=$(echo "$BODY" | sed -e 's/\[[^]]*\]//g' -e 's/([^)]*)//g' -e 's/[*#_`>]//g' | tr -s ' ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            DESCRIPTION=$(echo "$PLAIN_TEXT" | cut -c1-60)
            if [ ${#DESCRIPTION} -eq 60 ] && [ ${#PLAIN_TEXT} -gt 60 ]; then
              DESCRIPTION="${DESCRIPTION}..."
            fi
            ESCAPED_DESCRIPTION=$(echo "$DESCRIPTION" | sed 's/"/\\"/g')

            # 提取 image（正文第一张图片链接）
            FIRST_IMAGE=$(echo "$BODY" | grep -o '!\[.*\]([^)]*\.\(jpg\|jpeg\|png\|gif\|webp\|svg\|bmp\|ico\))' | head -n 1 | sed -e 's/.*(\(.*\))/\1/')
            # 如果找不到，尝试匹配 Markdown 链接形式的图片
            if [ -z "$FIRST_IMAGE" ]; then
              FIRST_IMAGE=$(echo "$BODY" | grep -o 'https\?://[^)]*\.\(jpg\|jpeg\|png\|gif\|webp\|svg\|bmp\|ico\)' | head -n 1)
            fi

            # 格式化日期为 Astro 要求的格式（UTC，Z 结尾，兼容所有 JS 引擎）
            ASTRODATE=$(date -u -d "$CREATED_AT" +"%Y-%m-%dT%H:%M:%SZ")

            # 创建 markdown 文件（匹配 config.ts 的 schema）
            {
              echo '---'
              echo "title: \"$ESCAPED_TITLE\""
              echo "date: $ASTRODATE"
              echo "issue_number: $NUMBER"
              echo "description: \"$ESCAPED_DESCRIPTION\""
              echo "tags: $LABELS_JSON"
              if [ -n "$FIRST_IMAGE" ]; then
                echo "image: \"$FIRST_IMAGE\""
              fi
              echo "draft: $DRAFT"
              echo '---'
              echo ""
              echo "$BODY"
            } > "$FILEPATH"

            echo "Created/Updated post: $FILENAME (draft: $DRAFT)"
          done

      # 推送 Markdown 文件到源代码仓库
      - name: Push markdown files to source repository
        run: |
          cd source-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 先拉取远程最新变更（使用 rebase 避免合并提交）
          git pull --rebase https://x-access-token:${{ secrets.ISSUES_ZEN }}@github.com/shenjuexiao/issues-zen-source.git main || true

          # 添加所有文章到 git（包括新文件和删除的文件）
          git add src/content/blog/

          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update posts from issues [skip ci]"
            git push https://x-access-token:${{ secrets.ISSUES_ZEN }}@github.com/shenjuexiao/issues-zen-source.git main
          fi

      # 检查是否有文章存在
      - name: Check if any posts exist
        id: check_posts
        run: |
          POST_COUNT=$(find source-repo/src/content/blog -name "*.md" -type f 2>/dev/null | wc -l)
          echo "post_count=$POST_COUNT" >> $GITHUB_OUTPUT
          echo "Found $POST_COUNT posts"

      # 构建 Astro 静态文件
      - name: Build Astro static files
        if: steps.check_posts.outputs.post_count > 0
        run: |
          cd source-repo
          npm run build

      # 部署到公共仓库（issues-zen-dist）的 gh-pages 分支
      - name: Deploy to gh-pages (public repository)
        if: steps.check_posts.outputs.post_count > 0
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ISSUES_ZEN }}
          external_repository: shenjuexiao/issues-zen-dist
          publish_branch: gh-pages
          publish_dir: ./source-repo/dist
          cname: issues-zen.shenjuexiao.com


